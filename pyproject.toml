[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "canidelete"
version = "0.1.0"
description = "Find the workarounds in your code that you can finally delete: closed upstream issues, upgraded deps, passed deadlines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["workaround", "tech-debt", "dead-code", "github", "linter", "cli", "todo"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Telle-dev/canidelete"

[project.scripts]
canidelete = "canidelete.cli:main"

[tool.setuptools]
packages = ["canidelete"]
