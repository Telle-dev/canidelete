# canidelete checks itself: this is exactly the workflow users copy.
name: canidelete
on:
  pull_request:
  schedule: [{ cron: "0 8 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
